name: CI

# Pull requests run this, and it is the gate: make it a required check in branch protection. release.yml
# does not re-run it.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run; every other run finishes.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npx biome ci --reporter=github .
      # The menu bar app's Tokens.swift and the mocks' token blocks match apps/menubar/tokens.json.
      - run: npm run menubar:tokens -- --check
      - run: npm run typecheck
      # Once, on .nvmrc's Node: Astro needs a newer one than dryfit's minimum.
      - run: npm run build -w @dryfit/site

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.12" } # the minimum in engines
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-latest, node: "24" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      # Some tests make real commits in throwaway repositories.
      - run: git config --global user.name "dryfit CI" && git config --global user.email "ci@dryfit.invalid"
      - run: npm run build -w @dryfit/cli
      # Unit tests, then integration tests against real Verdaccio, npm, pnpm, Yarn and Bun.
      - run: npm run test:all
      - name: The exit check, as a newcomer would run it
        run: scripts/newcomer.sh

  menubar-test:
    name: Menu bar app (tests)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/xcode
      # Snapshot tests skip themselves on a macOS version other than the one the references were drawn on.
      - run: npm run menubar:test
      - run: npm run menubar:e2e

  menubar-bundle:
    name: Menu bar app (universal build)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bundle.sh only reads the version with Node; it needs no dependencies.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/xcode
      - run: apps/menubar/scripts/bundle.sh
        env:
          DRYFIT_UNIVERSAL: "1"
