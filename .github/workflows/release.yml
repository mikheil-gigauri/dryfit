name: Release

# npm trusts this file by name (trusted publishing), so it stays release.yml.
on:
  push:
    branches: [main]

permissions: {}

# No CI here. Pull requests are the gate (required checks in branch protection), and the release pull
# request gets CI too. Re-running the whole matrix on main could only block a release on a flaky test
# or a drifted runner, not on a code change nobody had checked.
jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One release at a time. The lock only orders runs that reach it, so a run also checks below that
    # its commit is still the newest on main.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # the release pull request, tags and GitHub releases
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) and provenance
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A run for an older commit that reaches the lock after a newer commit landed would act on the
      # older commit: reopen a release pull request for changesets the newer commit already released,
      # or publish without the newer changes. The newer commit's own run releases instead.
      - id: newest
        name: Check this is still the newest commit on main
        run: |
          tip="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved on to ${tip:0:7}, whose own run releases. Skipping ${GITHUB_SHA:0:7}."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.newest.outputs.newest == 'true'
        uses: ./.github/actions/setup
        with:
          cache: ""
          registry-url: https://registry.npmjs.org
          # This job can publish to npm (OIDC) and push to the repository. A compromised dependency's
          # postinstall must not run with that; publishing needs no install script (prepack builds).
          ignore-scripts: "true"
      # The one cheap check kept: the package still builds and packs. prepack runs the build.
      - if: steps.newest.outputs.newest == 'true'
        name: Check the package builds and packs
        run: npm pack --dry-run -w @dryfit/cli
      # GitHub runs no workflows for what GITHUB_TOKEN pushes, so the release pull request is pushed as
      # the release GitHub App instead, and gets CI. Without the App it falls back to GITHUB_TOKEN.
      - id: app-token
        if: steps.newest.outputs.newest == 'true' && vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.newest.outputs.newest == 'true' && steps.app-token.outcome != 'success'
        run: echo "::warning::No release GitHub App configured, so the release pull request gets no CI. See CONTRIBUTING.md#releasing."
      # With changesets on main: opens or updates the release pull request. Once that is merged:
      # publishes to npm and tags @dryfit/cli@<version>. No npm token: npm trusts this workflow (trusted
      # publishing, set on the package's npmjs.com settings) and adds provenance by itself.
      # It does not create the GitHub release: a release is "latest" the moment it exists, and installed
      # apps fetch releases/latest/download/appcast.xml, which 404s until the menu bar job has attached
      # it, so every check in that window failed with "error retrieving update information". The menu
      # bar job creates the release once everything is attached.
      - id: changesets
        if: steps.newest.outputs.newest == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          version-script: npm run version-packages
          publish-script: npm run release
          create-github-releases: false
          commit-message: "chore: release"
          pr-title: Release
      - id: version
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=$(node -p "require('./packages/dryfit/package.json').version")" >> "$GITHUB_OUTPUT"

  menubar:
    name: Menu bar app
    needs: npm
    if: needs.npm.outputs.published == 'true'
    runs-on: macos-latest
    timeout-minutes: 45 # notarization waits on Apple
    permissions:
      contents: write # attach the app to the GitHub release
    env:
      VERSION: ${{ needs.npm.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/@dryfit/cli@${{ needs.npm.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/xcode
      - name: Check signing is set up
        id: secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::No Developer ID certificate in the repository secrets, so the app is released signed ad hoc and not notarized. See CONTRIBUTING.md#releasing."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi
          echo "cask=$([ -n "$MACOS_CERTIFICATE" ] && [ -n "$HOMEBREW_TAP_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::No SPARKLE_PRIVATE_KEY in the repository secrets, so this release publishes no update feed and installed apps do not update to it. See CONTRIBUTING.md#releasing."
            echo "appcast=false" >> "$GITHUB_OUTPUT"
          else
            echo "appcast=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Import the Developer ID certificate
        if: steps.secrets.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          # shellcheck disable=SC2046 # one argument per keychain already in the search list
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Build, sign and notarize Dryfit.app
        id: notarized
        if: steps.secrets.outputs.sign == 'true'
        env:
          DRYFIT_UNIVERSAL: "1"
          DRYFIT_SIGN_IDENTITY: Developer ID Application
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          apps/menubar/scripts/bundle.sh
          output="$(apps/menubar/scripts/notarize.sh)"
          echo "zip=$(echo "$output" | tail -2 | head -1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$output" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Build Dryfit.app, signed ad hoc
        id: adhoc
        if: steps.secrets.outputs.sign != 'true'
        env:
          DRYFIT_UNIVERSAL: "1"
        run: |
          apps/menubar/scripts/bundle.sh
          zip="apps/menubar/build/Dryfit-$VERSION.zip"
          ditto -c -k --keepParent apps/menubar/build/Dryfit.app "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      - name: Pack it into Dryfit.dmg
        id: dmg
        env:
          DRYFIT_SIGN_IDENTITY: ${{ steps.secrets.outputs.sign == 'true' && 'Developer ID Application' || '' }}
        run: echo "path=$(apps/menubar/scripts/dmg.sh)" >> "$GITHUB_OUTPUT"
      # The feed installed apps check: it names the zip and carries its EdDSA signature.
      - name: Write the update feed
        id: appcast
        if: steps.secrets.outputs.appcast == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ZIP: ${{ steps.notarized.outputs.zip || steps.adhoc.outputs.zip }}
        run: echo "path=$(apps/menubar/scripts/appcast.sh "$ZIP")" >> "$GITHUB_OUTPUT"
      # A draft is invisible to "latest", so installed apps keep seeing the previous release's feed until
      # the app, the dmg and the feed are all attached; publishing then makes the new one latest at once.
      # A re-run finds the release already there and attaches again.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.dmg.outputs.path }}
          ZIP: ${{ steps.notarized.outputs.zip || steps.adhoc.outputs.zip }}
          APPCAST: ${{ steps.appcast.outputs.path }}
        run: |
          tag="@dryfit/cli@$VERSION"
          # The list includes drafts, which a lookup by tag does not find: a re-run after a failure here
          # must reuse the draft, not make a second one.
          if ! gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qxF "$tag"; then
            # The notes are this version's section of the changelog, as the changesets action wrote them.
            notes="$RUNNER_TEMP/notes.md"
            awk -v heading="## $VERSION" '$0 == heading { on = 1; next } /^## / { on = 0 } on' packages/dryfit/CHANGELOG.md > "$notes"
            if [ -s "$notes" ]; then
              gh release create "$tag" --verify-tag --draft --title "$tag" --notes-file "$notes"
            else
              gh release create "$tag" --verify-tag --draft --title "$tag" --generate-notes
            fi
          fi
          gh release upload "$tag" "$DMG" "$ZIP" ${APPCAST:+"$APPCAST"} --clobber
          gh release edit "$tag" --draft=false --latest
      - name: Update the Homebrew cask
        if: steps.secrets.outputs.cask == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SHA256: ${{ steps.notarized.outputs.sha256 }}
        run: |
          git clone --depth 1 "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/mikheil-gigauri/homebrew-dryfit.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          apps/menubar/scripts/cask.sh "$VERSION" "$SHA256" > "$RUNNER_TEMP/tap/Casks/dryfit.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dryfit.rb
          # A re-run of a release finds the cask already up to date.
          if git diff --cached --quiet; then
            echo "The cask is already at $VERSION."
          else
            git commit -m "dryfit $VERSION"
            git push
          fi
